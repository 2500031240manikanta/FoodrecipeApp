<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodRecipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <main class="home-card">
        <div>
            <h1>FoodRecipes</h1>
            <p class="small-text">Online Food Recipe Management System</p>
        </div>
        <nav class="home-actions">
            <span id="user-name" class="user-name" hidden></span>
            <a id="user-module-link" href="user.html" hidden>User Module</a>
            <a id="admin-module-link" href="admin.html" hidden>Admin Module</a>
            <a id="login-link" href="login.html">Login</a>
            <a id="register-link" href="register.html">Register</a>
            <a id="logout-link" href="index.html" hidden>Logout</a>
        </nav>
    </main>

    <p id="welcome-message" class="welcome-message"></p>

    <section class="module-cards">
        <div class="module-card">
            <h2>User Module</h2>
            <p>Browse, search, filter, save and share food recipes.</p>
            <a href="user.html">Open User Module</a>
        </div>
        <div class="module-card admin-card">
            <h2>Admin Module</h2>
            <p>Add, edit, delete and manage recipes and users.</p>
            <a href="admin.html">Open Admin Module</a>
        </div>
    </section>

    <section class="food-gallery" aria-label="Featured dishes">
        <figure>
            <img src="images.jpg" alt="Chicken biryani">
            <figcaption>Chicken Biryani</figcaption>
        </figure>
        <figure>
            <img src="https://media1.agfg.com.au/images/listing/75681/gallery/pint-size-indian-4.jpg" alt="Butter chicken">
            <figcaption>Butter Chicken</figcaption>
        </figure>
        <figure>
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy%2Cf_auto%2Cq_auto%2Cw_300%2Ch_300%2Cc_fit/FOOD_CATALOG/IMAGES/CMS/2025/12/11/77a31327-2ca8-4f70-bd78-96513b8db20d_838cbe58-c03b-4adc-a869-a2aa3cc704c0.jpg" alt="Paneer tikka">
            <figcaption>Paneer Tikka</figcaption>
        </figure>
    </section>

    <script src="script.js"></script>
</body>
</html>
