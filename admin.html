<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Module | FoodRecipes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="module-page">
<header class="module-header">
    <div>
        <h1>Admin Module</h1>
        <p>Recipe and User Management</p>
    </div>
    <nav>
        <a href="index.html">Home</a>
        <button id="logoutBtn" class="small-btn">Logout</button>
    </nav>
</header>

<main class="module-content">
    <section class="admin-stats">
        <div><strong id="recipeTotal">0</strong><span>Total Recipes</span></div>
        <div><strong id="userTotal">0</strong><span>Registered Users</span></div>
    </section>

    <section class="admin-panel">
        <h2 id="formTitle">Add New Recipe</h2>
        <form id="recipeForm" class="admin-form">
            <input type="hidden" id="recipeId">
            <input id="recipeName" placeholder="Recipe Name" required>
            <select id="recipeCategory" required>
                <option value="">Select Category</option>
                <option>Indian Vegetarian</option>
                <option>Indian Non-Vegetarian</option>
                <option>Breakfast</option>
                <option>Desserts</option>
                <option>Snacks</option>
            </select>
            <input id="recipeImage" placeholder="Image URL or filename" required>
            <textarea id="recipeDescription" placeholder="Recipe description" required></textarea>
            <button type="submit">Save Recipe</button>
            <button type="button" id="cancelEdit" class="secondary-btn" hidden>Cancel Edit</button>
        </form>
    </section>

    <section class="admin-panel">
        <div class="panel-heading">
            <h2>Manage Recipes</h2>
            <input id="adminSearch" placeholder="Search recipes...">
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Actions</th></tr></thead>
                <tbody id="recipeTable"></tbody>
            </table>
        </div>
    </section>

    <section class="admin-panel">
        <h2>Registered Users</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
const admin = JSON.parse(localStorage.getItem("loggedInUser"));
if (!admin || admin.role !== "admin") {
    window.location.href = "login.html";
}

document.getElementById("logoutBtn").onclick = () => {
    localStorage.removeItem("loggedInUser");
    window.location.href = "index.html";
};

const defaultRecipes = [
    {id: 1, name: "Chicken Biryani", category: "Indian Non-Vegetarian", image: "images.jpg", description: "Aromatic basmati rice cooked with spiced chicken."},
    {id: 2, name: "Butter Chicken", category: "Indian Non-Vegetarian", image: "https://media1.agfg.com.au/images/listing/75681/gallery/pint-size-indian-4.jpg", description: "Creamy tomato-based chicken curry."},
    {id: 3, name: "Paneer Tikka", category: "Indian Vegetarian", image: "https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy%2Cf_auto%2Cq_auto%2Cw_300%2Ch_300%2Cc_fit/FOOD_CATALOG/IMAGES/CMS/2025/12/11/77a31327-2ca8-4f70-bd78-96513b8db20d_838cbe58-c03b-4adc-a869-a2aa3cc704c0.jpg", description: "Grilled paneer marinated with Indian spices."}
];

function getRecipes() {
    let recipes = JSON.parse(localStorage.getItem("recipes"));
    if (!recipes || !recipes.length) {
        recipes = defaultRecipes;
        localStorage.setItem("recipes", JSON.stringify(recipes));
    }
    return recipes;
}

function saveRecipes(recipes) {
    localStorage.setItem("recipes", JSON.stringify(recipes));
    render();
}

function render() {
    const recipes = getRecipes();
    const users = JSON.parse(localStorage.getItem("users")) || [];

    document.getElementById("recipeTotal").textContent = recipes.length;
    document.getElementById("userTotal").textContent = users.length;

    const search = document.getElementById("adminSearch").value.toLowerCase();
    const filtered = recipes.filter(r => r.name.toLowerCase().includes(search));

    document.getElementById("recipeTable").innerHTML = filtered.map(r => `
        <tr>
            <td>${r.id}</td>
            <td>${r.name}</td>
            <td>${r.category}</td>
            <td>
                ${r.creatorEmail === admin.email
                    ? `<button class="table-btn" onclick="editRecipe(${r.id})">Edit</button>
                       <button class="table-btn delete-btn" onclick="deleteRecipe(${r.id})">Delete</button>`
                    : `<span>Only creator can edit/delete</span>`
                }
            </td>
        </tr>
    `).join("");

    document.getElementById("userTable").innerHTML = users.length
        ? users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>User</td></tr>`).join("")
        : '<tr><td colspan="3">No registered users yet.</td></tr>';
}

document.getElementById("recipeForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let recipes = getRecipes();
    const id = Number(document.getElementById("recipeId").value);

    const recipeData = {
        id: id || (recipes.length ? Math.max(...recipes.map(r => Number(r.id) || 0)) + 1 : 1),
        name: document.getElementById("recipeName").value.trim(),
        category: document.getElementById("recipeCategory").value,
        image: document.getElementById("recipeImage").value.trim(),
        description: document.getElementById("recipeDescription").value.trim(),
        creatorEmail: id
            ? (recipes.find(r => r.id === id)?.creatorEmail || admin.email)
            : admin.email,
        creatorName: id
            ? (recipes.find(r => r.id === id)?.creatorName || admin.name)
            : admin.name
    };

    if (id) {
        const existingRecipe = recipes.find(r => r.id === id);

        if (!existingRecipe || existingRecipe.creatorEmail !== admin.email) {
            alert("You can edit only the recipes added by you.");
            return;
        }

        recipes = recipes.map(r => r.id === id ? recipeData : r);
    } else {
        recipes.push(recipeData);
    }

    saveRecipes(recipes);
    this.reset();
    document.getElementById("recipeId").value = "";
    document.getElementById("formTitle").textContent = "Add New Recipe";
    document.getElementById("cancelEdit").hidden = true;
});

window.editRecipe = function(id) {
    const recipe = getRecipes().find(r => r.id === id);
    if (!recipe) return;

    if (recipe.creatorEmail !== admin.email) {
        alert("You can edit only the recipes added by you.");
        return;
    }

    document.getElementById("recipeId").value = recipe.id;
    document.getElementById("recipeName").value = recipe.name;
    document.getElementById("recipeCategory").value = recipe.category;
    document.getElementById("recipeImage").value = recipe.image;
    document.getElementById("recipeDescription").value = recipe.description;
    document.getElementById("formTitle").textContent = "Edit Recipe";
    document.getElementById("cancelEdit").hidden = false;
    window.scrollTo({top: 0, behavior: "smooth"});
};

window.deleteRecipe = function(id) {
    const recipes = getRecipes();
    const recipe = recipes.find(r => r.id === id);

    if (!recipe) return;

    if (recipe.creatorEmail !== admin.email) {
        alert("You can delete only the recipes added by you.");
        return;
    }

    if (!confirm("Are you sure you want to delete this recipe?")) return;

    const updatedRecipes = recipes.filter(r => r.id !== id);
    saveRecipes(updatedRecipes);
};

document.getElementById("cancelEdit").onclick = function() {
    document.getElementById("recipeForm").reset();
    document.getElementById("recipeId").value = "";
    document.getElementById("formTitle").textContent = "Add New Recipe";
    this.hidden = true;
};

document.getElementById("adminSearch").addEventListener("input", render);
render();
</script>
</body>
</html>
